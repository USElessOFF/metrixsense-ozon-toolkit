name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check backend

      - name: Run tests (excluding live Ozon API tests)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest backend/tests -m "not live" -q

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  detect-frontend:
    name: Detect frontend sources
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        # hashFiles недоступен в job-level if, поэтому проверяем файл через shell
        run: echo "frontend=$(test -f web/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"

  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: detect-frontend
    # Automatically activates once web/package.json appears in the repo
    if: needs.detect-frontend.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, typecheck, build
        working-directory: web
        run: |
          npm ci
          npm run check --if-present
          npm run build
