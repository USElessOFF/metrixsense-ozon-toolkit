<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad128" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5fb4"/>
      <stop offset="40%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="chartGrad128" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <filter id="shadow128">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow128">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="128" height="128" rx="24" fill="url(#bgGrad128)" filter="url(#shadow128)"/>
  
  <!-- Сетка -->
  <g opacity="0.08">
    <line x1="20" y1="20" x2="20" y2="108" stroke="white" stroke-width="1"/>
    <line x1="44" y1="20" x2="44" y2="108" stroke="white" stroke-width="1"/>
    <line x1="68" y1="20" x2="68" y2="108" stroke="white" stroke-width="1"/>
    <line x1="92" y1="20" x2="92" y2="108" stroke="white" stroke-width="1"/>
    <line x1="20" y1="40" x2="108" y2="40" stroke="white" stroke-width="1"/>
    <line x1="20" y1="60" x2="108" y2="60" stroke="white" stroke-width="1"/>
    <line x1="20" y1="80" x2="108" y2="80" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- График -->
  <path d="M24 98 L38 74 L52 86 L66 58 L80 70 L94 44 L104 48 L104 98 Z" 
        fill="url(#chartGrad128)" opacity="0.15"/>
  <path d="M24 98 L38 74 L52 86 L66 58 L80 70 L94 44 L104 48" 
        fill="none" stroke="url(#chartGrad128)" stroke-width="4" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow128)"/>
  
  <!-- Точки на графике -->
  <circle cx="38" cy="74" r="4.5" fill="#ffffff" filter="url(#glow128)"/>
  <circle cx="66" cy="58" r="4.5" fill="#ffffff" filter="url(#glow128)"/>
  <circle cx="94" cy="44" r="4.5" fill="#ffffff" filter="url(#glow128)"/>
  
  <!-- Буква M -->
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" 
        fill="white" opacity="0.95" letter-spacing="-2">
    M
  </text>
  
  <!-- Подпись SENSE -->
  <text x="82" y="66" font-family="Arial, sans-serif" font-size="14" font-weight="600" 
        fill="white" opacity="0.4" letter-spacing="1.5">
    SENSE
  </text>
  
  <!-- Звезда -->
  <g transform="translate(106, 30)" opacity="0.6">
    <polygon points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" fill="#60a5fa"/>
  </g>
</svg>