server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA / static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: no trailing slash in proxy_pass — the original request URI is
    # passed unchanged, so backend routes keep their /api prefix.
    # (proxy_pass with a URI part would strip the location prefix and 404.)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # FastAPI documentation (same paths on the backend)
    location = /docs { proxy_pass http://backend:8000; }
    location /docs/ { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }
    location = /redoc { proxy_pass http://backend:8000; }
}

