services:
  backend:
    build: .
    container_name: metrixsense_backend
    environment:
      - DB_PATH=/app/data/metrixsense.db
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite+aiosqlite:////app/data/metrixsense.db
      - LOG_DIR=/app/backend/logs
      - DEBUG=false
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./backend/data:/app/data
      # Reports are written to {PROJECT_ROOT}/files => /app/backend/files
      - ./backend/files:/app/backend/files
      - ./backend/logs:/app/backend/logs
    ports:
      # Reachable only from this computer. Use "8000:8000" to expose to LAN.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: metrixsense_frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

