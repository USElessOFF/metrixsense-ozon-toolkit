# Ruff configuration (light, non-intrusive)
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "web", "backend/alembic/versions"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"backend/tests/conftest.py" = ["E402"]
# main.py вставляет PROJECT_DIR в sys.path перед импортом backend-пакетов
"backend/app/main.py" = ["E402"]
